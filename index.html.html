<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>รายงานประจำวัน ขนส่งจันทบุรี</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1f8;--fg:#222;--cd:#fff;--bd:#d6d0e4;--ac:#7b4fc9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a23;--fg:#eee;--cd:#2a2733;--bd:#454056}}
:root[data-theme="dark"]{--bg:#1c1a23;--fg:#eee;--cd:#2a2733;--bd:#454056}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'TH Sarabun New',Sarabun,Tahoma,sans-serif;background-color:var(--bg)}
main{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;padding:12px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
#ed{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1;padding:8px 2px;border:1px solid var(--bd);background:none;color:var(--fg);border-radius:8px;font:inherit}.tabs .on{background:var(--ac);color:#fff}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
input,select,button{font:inherit}input[type=number],input[type=month],input[type=text],select{padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);max-width:170px;width:100%;box-sizing:border-box}
input[type=color]{width:44px;height:30px;padding:0;border:none;background:none}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}.chip{padding:8px 0;border:1px solid var(--bd);background:none;color:var(--fg);border-radius:8px}.chip.we{opacity:.5}.chip.hol{background:#f6c6c6;color:#900}.chip.on{outline:2px solid var(--ac);font-weight:700}
table.in{width:100%;border-collapse:collapse;font-size:13px}.in td,.in th{padding:2px}.in input{max-width:60px;text-align:center}
h4{margin:12px 0 4px}.bt{display:block;width:100%;margin:6px 0;padding:10px;border:0;border-radius:8px;background:var(--ac);color:#fff}.bt.o{background:none;border:1px solid var(--ac);color:var(--ac)}
small{opacity:.7}
#pvw{overflow:hidden}#pv{width:720px;zoom:var(--z,1)}
.rc{width:720px;min-height:975px;position:relative;font-family:'TH Sarabun New',Sarabun,Tahoma,sans-serif;color:#222;overflow:hidden;margin:0 0 16px;display:flex;box-sizing:border-box}
.z{position:relative;z-index:1;width:100%;display:flex;flex-direction:column}.bi{position:absolute;inset:0;background-size:cover;background-position:center}
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px;white-space:nowrap}
.of{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 16px;border:1px solid #9a7fd0;font-size:1.2em;line-height:1.2;color:#fff}.of img{height:48px}.of small{display:block;font-size:.7em}
.tl{text-align:right;font-size:1em;line-height:1.4}.tl b{display:block;font-size:1.15em}
.bn{margin:10px 18px;padding:8px;text-align:center;font-size:25px;font-weight:700;border-radius:10px;border:1px solid #c9a100;color:#5a3a00}
table.tb{width:calc(100% - 36px);margin:6px 18px;border-collapse:collapse;font-size:18px}.tb td,.tb th{border:1px solid #000;padding:7px 5px;text-align:center}.tb td:first-child{text-align:left;font-weight:700}.tb th{color:#fff}
.cb{background:#fff;margin:12px 18px;padding:10px}.ct{text-align:center;font-weight:700;font-size:16px;margin-bottom:6px}
.lg{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:10px;margin-top:4px}.lg i{display:inline-block;width:9px;height:9px;margin-right:4px}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:1px 20px;font-size:14px;color:#fff}.ft b{font-size:22px}
.hol{margin:6px 18px;padding:6px;text-align:center;background:#fde8e8;color:#c00;font-weight:700;border-radius:8px}
.tsm{text-align:center;font-size:54px;font-weight:700;color:#7b3fb0;letter-spacing:4px}
.sb{margin:8px auto;padding:8px 20px;background:#dbe7f6;border:2px solid #9bb5de;color:#2b4a8a;font-size:24px;font-weight:700;text-align:center}
.bx{margin:10px 40px;border:3px dashed #444;padding:14px 40px;font-size:24px;background:rgba(255,255,255,.6)}.bx div{display:flex;gap:16px}.bx span:first-child{flex:1}.bx em{color:red;font-style:normal;margin:0 8px}
</style></head><body><main>
<section id="ed"></section>
<section id="pvw"><div id="pv"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const MN=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const SH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const F1=[['tc','ตัดคะแนนความประพฤติ'],['sp','พักใช้ใบอนุญาตขับรถ'],['rt','อบรมคืนคะแนน']];
const P=[['t','พรบ.จราจร'],['c','พรบ.รถยนต์'],['x','พรบ.ขนส่ง']];
const F2=[['ap','ผู้สมัครสอบ'],['te','ผู้เข้ารับการทดสอบ'],['ps','ผ่าน'],['fl','ไม่ผ่าน']];
const K1=F1.flatMap(r=>P.map(p=>r[0]+p[0])),K2=F2.map(f=>f[0]);
const L1=F1.flatMap(r=>P.map(p=>r[1]+' '+p[1])),L2=['ผู้สมัครสอบ','ผู้เข้ารับการทดสอบ','ทดสอบ ผ่าน','ทดสอบ ไม่ผ่าน'];
const iso=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const DEF=()=>({o:'สำนักงานขนส่งจังหวัดจันทบุรี',oe:'Provincial Land Transport office Chanthaburi',sc:1.5,ft:1,hi1:'',hi2:'',hp1:'center',hp2:'center',lg:'',bi:'',d:{},h:{},m:'',cur:'',
th:{hz1:90,hz2:90,hs:15,hd:'#c993f2',ft:'#c993f2',tb:'#5b9bd5',tt:'#f5c518',bg:'#ffffff',pat:'grid',po:.12,bo:.3,
s1:['#d9534f','#7a2b2b','#e08a8a','#8e3b3b','#e9a3a3','#7e57c2','#f5a742','#4b3a7a','#d2691e'],s2:['#ed9a4a','#a04a12','#f4a77a','#e06a1e']}});
let S=DEF(),tab=0;
try{const x=JSON.parse(localStorage.getItem('tsmrep')||'null');if(x)S={...S,...x,th:{...S.th,...x.th}}}catch(e){}
if(!S.m){const t=new Date();S.m=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');S.cur=iso(t.getFullYear(),t.getMonth()+1,t.getDate())}
const sv=()=>{try{localStorage.setItem('tsmrep',JSON.stringify(S))}catch(e){}};
function mdays(){const[y,m]=S.m.split('-').map(Number),r=[];for(let d=1,n=new Date(y,m,0).getDate();d<=n;d++)r.push({dt:iso(y,m,d),d,w:new Date(y,m-1,d).getDay()});return r}
const n=(dt,k)=>+(S.d[dt]?.[k])||0,has=dt=>Object.values(S.d[dt]||{}).some(v=>v!==''&&v!=null);
const cd=()=>mdays().filter(x=>!S.h[x.dt]&&(x.w%6||has(x.dt)));
const lbl=dt=>+dt.slice(8)+' '+SH[+dt.slice(5,7)-1];
const full=dt=>+dt.slice(8)+' '+MN[+dt.slice(5,7)-1]+' พ.ศ. '+(+dt.slice(0,4)+543);
const mon=()=>MN[+S.m.slice(5)-1]+' '+(+S.m.slice(0,4)+543);
function chart(keys,cols){const ds=cd().map(x=>x.dt),cats=[...ds,'sum'],W=680,H=250,L=30,B=50,T=8,gw=(W-L)/cats.length,ch=H-B-T;
const val=(c,k)=>c=='sum'?ds.reduce((a,d)=>a+n(d,k),0):n(d=c,k);var d;
let mx=Math.max(1,Math.ceil(Math.max(...cats.flatMap(c=>keys.map(k=>val(c,k))))));const Y=v=>T+ch-v/mx*ch;
let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
for(let i=0;i<=5;i++){const v=mx*i/5,y=Y(v);s+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#bbb"/><text x="${L-4}" y="${y+3}" font-size="9" text-anchor="end">${+v.toFixed(1)}</text>`}
cats.forEach((c,i)=>{const x0=L+i*gw,bw=gw*.8/keys.length,hol=S.h[c];
if(hol)s+=`<rect x="${x0}" y="${T}" width="${gw}" height="${ch}" fill="#999" opacity=".2"/>`;
keys.forEach((k,j)=>{const h=Math.max(val(c,k)/mx*ch,1);s+=`<rect x="${x0+gw*.1+j*bw}" y="${T+ch-h}" width="${bw}" height="${h}" fill="${cols[j]}"/>`});
s+=`<text transform="translate(${x0+gw/2+3},${H-B+10}) rotate(-45)" font-size="9" text-anchor="end">${c=='sum'?'รวมรายเดือน':lbl(c)+(hol?' (หยุด)':'')}</text>`});
return s+'</svg>'}
const legend=(ls,cs)=>`<div class="lg">${ls.map((l,i)=>`<span><i style="background:${cs[i]}"></i>${l}</span>`).join('')}</div>`;
const chartBox=(k,c,l)=>`<div class="cb"><div class="ct">สถิติผู้เข้ารับบริการฝ่ายกลุ่มวิชาการขนส่ง ประจำเดือน ${mon()}</div>${chart(k,c)}${legend(l,c)}</div>`;
function bgcss(){const t=S.th,a=t.po;const p={grid:`background-image:linear-gradient(rgba(0,0,0,${a}) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,${a}) 1px,transparent 1px);background-size:14px 14px`,dots:`background-image:radial-gradient(rgba(0,0,0,${a*2}) 1.6px,transparent 2px);background-size:14px 14px`,stripes:`background-image:repeating-linear-gradient(45deg,rgba(0,0,0,${a}) 0 2px,transparent 2px 10px)`,none:''}[t.pat];return `background-color:${t.bg};${p}`}
const hi=i=>S['hi'+i]?`<div style="text-align:${S['hp'+i]=='left'?'left':'center'};margin:6px 18px 0"><img src="${S['hi'+i]}" style="height:${S.th['hz'+i]}px;max-width:100%;object-fit:contain"></div>`:'';
const bn=(i,st,txt)=>{const im=S['hi'+i];return im&&S['hp'+i]=='left'?`<div style="display:flex;align-items:center;gap:10px;margin:10px 18px"><img src="${im}" style="height:${S.th['hz'+i]}px;max-width:40%;object-fit:contain"><div class="bn" style="${st};margin:0;flex:1">${txt}</div></div>`:hi(i)+`<div class="bn" style="${st}">${txt}</div>`};
function t1(dt){const t=S.th;const cum=r=>mdays().filter(x=>x.dt<=dt&&!S.h[x.dt]).reduce((a,x)=>a+P.reduce((b,p)=>b+n(x.dt,r[0]+p[0]),0),0);
const f=(x,i)=>x?x:(i?'-':0);
return `${bn(1,`background:${t.tt}`,'รายงานข้อมูลการตัดคะแนนความประพฤติในการขับรถ')}
<table class="tb"><tr style="background:${t.tb}"><th>รายงานข้อมูลการตัดคะแนน${P.map(p=>`<th>${p[1]}<br>(ราย)`).join('')}<th>รวม<br>(ราย)<th>สะสม<br>รายเดือน(ราย)</tr>
${F1.map((r,i)=>{const v=P.map(p=>n(dt,r[0]+p[0])),s=v.reduce((a,b)=>a+b,0);return `<tr style="background-color:${t.tb};background-image:linear-gradient(rgba(255,255,255,${[.3,.5,.3][i]}),rgba(255,255,255,${[.3,.5,.3][i]}))"><td>${r[1]}${v.map(x=>`<td>${f(x,i)}`).join('')}<td>${f(s,i)}<td>${f(cum(r),i)}</tr>`}).join('')}</table>`+chartBox(K1,t.s1,L1)}
function t2(dt){const t=S.th,g=k=>n(dt,k),row=(a,b)=>`<div><span>${a}</span><span>${b}</span></div>`;
return `${S.hi2?'':'<div class="tsm">TSM</div>'}${bn(2,`background:${t.tt};font-size:22px`,'รายงานบุคลากรจัดการด้านความปลอดภัยด้านการขนส่ง (TSM)')}<div class="sb">ประชาชนเข้ารับบริการสมัคร และเข้ารับการทดสอบ ดังนี้</div>
<div class="bx">${row('ผู้สมัครสอบ',`จำนวน<em>${g('ap')}</em>ราย`)}${row('ผู้เข้ารับการทดสอบ',`จำนวน<em>${g('te')}</em>ราย`)}${row('จำนวนผู้เข้ารับการทดสอบ ผ่าน',`จำนวน<em>${g('ps')}</em>ราย`)}${row('จำนวนผู้เข้ารับการทดสอบ ไม่ผ่าน',`จำนวน<em>${g('fl')}</em>ราย`)}</div>`+chartBox(K2,t.s2,L2)}
function card(i){const t=S.th,dt=S.cur;return `<div class="rc" style="${bgcss()}">${S.bi?`<div class="bi" style="background-image:url(${S.bi});opacity:${t.bo}"></div>`:''}<div class="z">
<div class="hd" style="font-size:${t.hs}px"><div class="of" style="background:${t.hd}">${S.lg?`<img src="${S.lg}">`:''}<div><b>${S.o}</b><small>${S.oe}</small></div></div><div class="tl"><b>รายงานการให้บริการด้านกลุ่มวิชาการขนส่ง</b><span style="color:#6b3fa0">ประจำวันที่ ${full(dt)}</span></div></div>
${S.h[dt]?'<div class="hol">วันหยุดทำการ</div>':''}${i?t2(dt):t1(dt)}
${S.ft?`<div class="ft" style="background:${t.ft}"><div><b>กรมการขนส่งทางบก</b><br>“เป็นองค์กรแห่งนวัตกรรมในการควบคุม กำกับ ดูแล ระบบการขนส่งทางถนน ให้มีคุณภาพและปลอดภัย”</div><div style="text-align:center">สายด่วน<br><b>1584</b><br><small>ตลอด 24 ชม.</small></div></div>`:''}</div></div>`}
function draw(){$('#pv').innerHTML=card(0)+card(1);fit()}
function fit(){const w=$('#pvw').clientWidth;$('#pv').style.setProperty('--z',Math.min(1,w/720))}
addEventListener('resize',fit);
function setp(p,v){const a=p.split('.');let o=S;while(a.length>1)o=o[a.shift()];o[a[0]]=v}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.k)(S.d[S.cur]??={})[t.dataset.k]=t.value===''?'':+t.value;else if(t.dataset.p)setp(t.dataset.p,t.type=='range'||t.dataset.n?+t.value:t.value);else return;sv();draw()});
function setM(v){if(!v)return;S.m=v;S.cur=(mdays().find(x=>x.w%6)||mdays()[0]).dt;sv();panel();draw()}
function hol(c){c?S.h[S.cur]=1:delete S.h[S.cur];sv();panel();draw()}
function img(f,max,type,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(type,.8));sv();draw()};i.src=r.result};r.readAsDataURL(f)}
async function dl(name,data){try{const d=window.claude?await claude.use('downloads'):null;if(!d)return alert('มุมมองนี้บันทึกไฟล์ไม่ได้ ให้เปิดลิงก์ในแอป Claude');await d.save({filename:name,data})}catch(e){}}
async function png(i){const w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0;width:720px';w.innerHTML=card(i);document.body.append(w);try{await document.fonts.ready;const c=await html2canvas(w.firstElementChild,{scale:S.sc,backgroundColor:null,useCORS:true});return await new Promise(r=>c.toBlob(r,'image/png'))}finally{w.remove()}}
const csv=()=>{const ks=[...K1,...K2];return '\ufeffdate,holiday,'+ks.join(',')+'\n'+mdays().map(x=>x.dt+','+(S.h[x.dt]?1:0)+','+ks.map(k=>S.d[x.dt]?.[k]??'').join(',')).join('\n')};
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=r.result.replace(/^\ufeff/,'');if(f.name.endsWith('.json')){const x=JSON.parse(s),d=DEF();S={...d,...x,th:{...d.th,...x.th}}}else{const L=s.trim().split(/\r?\n/),H=L[0].split(',');L.slice(1).forEach(l=>{const c=l.split(',');if(!/^\d{4}-\d\d-\d\d$/.test(c[0]))return;c[1]=='1'?S.h[c[0]]=1:delete S.h[c[0]];S.d[c[0]]??={};H.slice(2).forEach((k,i)=>{S.d[c[0]][k]=c[i+2]===''||c[i+2]==null?'':+c[i+2]});S.m=c[0].slice(0,7);S.cur=c[0]})}sv();panel();draw()}catch(e){alert('อ่านไฟล์ไม่ได้')}};r.readAsText(f)}
function panel(){const t=S.th,dt=S.cur,v=k=>S.d[dt]?.[k]??'';
const col=(p,l,val)=>`<label>${l}<input type="color" data-p="${p}" value="${val}"></label>`,num=k=>`<input type="number" min="0" inputmode="numeric" data-k="${k}" value="${v(k)}">`;
let h=`<div class="tabs">${['กรอกข้อมูล','ตกแต่ง','ส่งต่อ/บันทึก'].map((x,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};panel()">${x}</button>`).join('')}</div>`;
if(tab==0)h+=`<label>เดือน<input type="month" value="${S.m}" onchange="setM(this.value)"></label><div class="chips">${mdays().map(x=>`<button class="chip ${x.dt==dt?'on':''} ${S.h[x.dt]?'hol':''} ${x.w%6?'':'we'}" onclick="S.cur='${x.dt}';sv();panel();draw()">${x.d}</button>`).join('')}</div>
<label><span><input type="checkbox" ${S.h[dt]?'checked':''} onchange="hol(this.checked)"> ${full(dt)} เป็นวันหยุดทำการ</span></label><h4>วันหยุดของเดือนนี้ (แตะเพื่อกำหนด / ยกเลิก)</h4><div class="chips">${mdays().map(x=>`<button class="chip ${S.h[x.dt]?'hol':''} ${x.w%6?'':'we'}" onclick="S.h['${x.dt}']?delete S.h['${x.dt}']:S.h['${x.dt}']=1;sv();panel();draw()">${x.d}</button>`).join('')}</div><small>วันหยุดจะถูกตัดออกจากกราฟและยอดสะสม · ช่องว่างนับเป็น 0 · เสาร์-อาทิตย์แสดงในกราฟเมื่อมีข้อมูล</small>
<h4>รายงาน 1: ตัดคะแนนความประพฤติ</h4><table class="in"><tr><th><th>จราจร<th>รถยนต์<th>ขนส่ง</tr>${F1.map(r=>`<tr><td>${r[1]}${P.map(p=>`<td>${num(r[0]+p[0])}`).join('')}</tr>`).join('')}</table>
<h4>รายงาน 2: TSM</h4>${F2.map(f=>`<label>${f[1]}${num(f[0])}</label>`).join('')}`;
if(tab==1)h+=`<label>ชื่อหน่วยงาน<input type="text" data-p="o" value="${S.o}"></label><label>ชื่ออังกฤษ<input type="text" data-p="oe" value="${S.oe}"></label>
<label><span><input type="checkbox" ${S.ft?'checked':''} onchange="S.ft=this.checked?1:0;sv();draw()"> แสดงแถบล่าง (footer)</span></label><label>ขนาดตัวอักษรหัวรายงาน<input type="range" min="11" max="20" step=".5" data-p="th.hs" value="${t.hs}"></label>${col('th.hd','สีป้ายหน่วยงาน',t.hd)}${col('th.ft','สีแถบล่าง',t.ft)}${col('th.tb','สีตาราง',t.tb)}${col('th.tt','สีแถบหัวข้อ',t.tt)}${col('th.bg','สีพื้นหลัง',t.bg)}
<label>ลายพื้นหลัง<select data-p="th.pat">${[['grid','ตาราง'],['dots','จุด'],['stripes','ทแยง'],['none','ไม่มี']].map(x=>`<option value="${x[0]}" ${t.pat==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
<label>ความเข้มลาย<input type="range" min="0" max=".4" step=".02" data-p="th.po" value="${t.po}"></label>
<label>โลโก้<input type="file" accept="image/*" onchange="img(this.files[0],200,'image/png',u=>S.lg=u)"></label>
${[1,2].map(i=>`<h4>ภาพหัวเรื่อง รายงาน ${i}</h4><label>อัปโหลด<input type="file" accept="image/*" onchange="img(this.files[0],600,'image/png',u=>S.hi${i}=u)"></label><label>ตำแหน่ง<select data-p="hp${i}"><option value="center" ${S['hp'+i]!='left'?'selected':''}>ตรงกลาง</option><option value="left" ${S['hp'+i]=='left'?'selected':''}>ชิดซ้าย</option></select></label><label>ขนาด<input type="range" min="30" max="300" step="5" data-p="th.hz${i}" value="${t['hz'+i]}"></label><button class="bt o" onclick="S.hi${i}='';sv();draw()">ลบภาพนี้</button>`).join('')}
<label>ภาพพื้นหลัง<input type="file" accept="image/*" onchange="img(this.files[0],900,'image/jpeg',u=>S.bi=u)"></label>
<label>ความจางภาพ<input type="range" min=".05" max="1" step=".05" data-p="th.bo" value="${t.bo}"></label><button class="bt o" onclick="S.bi='';S.lg='';S.hi1='';S.hi2='';sv();draw();panel()">ลบโลโก้/ภาพหัวเรื่อง/ภาพพื้นหลัง</button>
<h4>สีกราฟ รายงาน 1</h4>${L1.map((l,i)=>col('th.s1.'+i,l,t.s1[i])).join('')}<h4>สีกราฟ รายงาน 2</h4>${L2.map((l,i)=>col('th.s2.'+i,l,t.s2[i])).join('')}
<button class="bt o" onclick="S.th=DEF().th;sv();panel();draw()">คืนค่าสีเริ่มต้น</button>`;
if(tab==2)h+=`<label>ขนาดรูป<select data-p="sc" data-n="1">${[[1,'เล็ก 720 px'],[1.5,'LINE 1080 px'],[2,'ชัด 1440 px']].map(x=>`<option value="${x[0]}" ${S.sc==x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label>
<button class="bt" onclick="png(0).then(b=>dl('report1_'+S.cur+'.png',b))">บันทึกรูปรายงาน 1 (ส่ง LINE)</button><button class="bt" onclick="png(1).then(b=>dl('report2_'+S.cur+'.png',b))">บันทึกรูปรายงาน 2 (ส่ง LINE)</button>
<h4>สเปรดชีต / ส่งต่องาน</h4><button class="bt o" onclick="dl('daily_'+S.m+'.csv',csv())">ส่งออก CSV (เปิดใน Excel / Google Sheets)</button><button class="bt o" onclick="dl('backup_'+S.m+'.json',JSON.stringify(S))">ส่งออกไฟล์ส่งต่อ (.json รวมสีและโลโก้)</button>
<label>นำเข้า CSV / JSON<input type="file" accept=".csv,.json" onchange="imp(this.files[0])"></label><small>ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้อัตโนมัติ หากต้องการส่งต่อ ให้ส่งออกไฟล์แล้วส่งทาง LINE ให้ผู้รับนำเข้า</small>`;
$('#ed').innerHTML=h}
panel();draw();
</script></body></html>
